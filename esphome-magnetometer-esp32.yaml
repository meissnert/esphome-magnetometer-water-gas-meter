---
# ESP32 self-contained config for a Chinese 0x2C QMC5883L clone magnetometer.
# Full port of tronikos/esphome-magnetometer-water-gas-meter (adaptive + threshold
# detection, calibration, totalizer, flow) driven by raw I2C register polling.

substitutions:
  # water or gas
  device_class: 'water'

  # mdi:water or mdi:meter-gas
  device_icon: 'mdi:water'

  # For water one of: CCF, ft³, gal, L, m³
  # For better accuracy avoid using large units like CCF and m³.
  # You can always change the unit later in Home Assistant.
  volume_unit: 'gal'

  # LED pin (GPIO2 = onboard blue LED on many ESP32 dev boards)
  gpio_led: GPIO2

  # ESP32 Standard Hardware I2C Pins
  i2c_sda: GPIO21
  i2c_scl: GPIO22
  i2c_frequency: 100kHz  # Increased from 50kHz for faster register transfers

  # Raw I2C polling interval
  sensor_update_interval: 20ms

  volume_per_half_rotation_initial_value: '0.01008156'
  calibration_minimal_axis_range_initial_value: '20'
  flow_update_interval_seconds: '10'

  # Only publish updates if the magnetic field changes by at least this amount (in µT).
  # Reduces Wi-Fi traffic and Home Assistant database growth.
  magnetic_field_update_delta: '3'

  hide_magnetic_field_strength_sensors: 'true'
  hide_half_rotations_total_sensor: 'true'

  # Tuning parameters for the Min/Max Tracker algorithm:
  # Decay rate per tick (~20ms). Controls how fast the tracker follows thermal drift.
  # 0.0005 = ~1.5 µT/min. Increase if you see false triggers from temperature changes.
  tracker_decay_rate: '0.0005'
  # Minimum span as fraction of calibrated magnet_span. Keeps the detection window
  # open when flow stops, ensuring slow leaks are still detected.
  # 0.8 = window stays at 80% of calibrated size.
  min_span_multiplier: '0.8'
  # Maximum span as fraction of calibrated magnet_span.
  # If the calculated span exceeds this (e.g., due to bad initialization or huge signal jump),
  # the opposite tracker is dragged along to maintain the maximum allowed size.
  # 1.1 = Max allowed window is 120% of calibrated size.
  max_span_multiplier: '1.2'

# ESP32 Core Setup
esp32:
  board: esp32dev
  framework:
    type: arduino

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: ${i2c_frequency}
  scan: true

esphome:
  name: water-meter
  friendly_name: Water meter
  on_boot:
    priority: 800.0
    then:
      - lambda: |-
          // Write continuous mode to reg 0x09 (0x1D) and SET/RESET to reg 0x0A (0x01)
          uint8_t init_mode[2] = {0x09, 0x1D};
          uint8_t init_sr[2]   = {0x0A, 0x01};
          id(i2c_bus).write(0x2C, init_mode, 2);
          id(i2c_bus).write(0x2C, init_sr, 2);
          ESP_LOGI("magnetometer_clone", "Sensor initialized on boot.");

preferences:
  flash_write_interval: 60min

logger:
  level: DEBUG

api:
  encryption:
    key: "aIZ1jCrWYaz1uxNE1KSa/Q+06AHCugE1NO3cuLdYfUo="
  services:
    # Based on https://esphome.io/components/sensor/pulse_meter.html#re-setting-the-total-pulse-count
    # Useful if you would like the total sensor to match what you see on your meter you are trying to match.
    - service: set_total
      variables:
        new_total: float
      then:
        - globals.set:
            id: half_rotations_total
            value: !lambda 'return new_total / id(volume_per_half_rotation).state;'

ota:
  - platform: esphome
    password: "d44ed9df293facf65e288062d5c7a5e7"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: watermeter Fallback Hotspot
    password: "RboloNfHnWZ3"

captive_portal:

globals:
  - id: half_rotations_total
    type: long
    restore_value: true
    initial_value: '0'
  - id: half_rotations_flow
    type: long
    restore_value: false
    initial_value: '0'
  - id: axis_value_high
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: calibrating
    type: bool
    restore_value: false
    initial_value: 'false'

  # TRACKERS for Min/Max Algorithm (initialized to NAN, set on first reading)
  - id: track_min
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: track_max
    type: float
    restore_value: false
    initial_value: 'NAN'

  # Calibration Vars
  - id: calibrating_axis_x_min
    type: float
    restore_value: false
  - id: calibrating_axis_x_max
    type: float
    restore_value: false
  - id: calibrating_axis_y_min
    type: float
    restore_value: false
  - id: calibrating_axis_y_max
    type: float
    restore_value: false
  - id: calibrating_axis_z_min
    type: float
    restore_value: false
  - id: calibrating_axis_z_max
    type: float
    restore_value: false

  # Mirrors of the axis / detection_algorithm template selects.
  # Kept in globals so lambdas don't depend on the select API, which differs
  # between ESPHome versions (current_option() vs state).
  - id: selected_axis
    type: std::string
    restore_value: false
    initial_value: '"None"'
  - id: selected_algorithm
    type: std::string
    restore_value: false
    initial_value: '"Adaptive"'

number:
  - platform: template
    id: volume_per_half_rotation
    name: "Volume per half rotation"
    entity_category: config
    mode: box
    min_value: 0
    max_value: 9999999
    step: 0.000000001
    initial_value: ${volume_per_half_rotation_initial_value}
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: ${volume_unit}
    icon: mdi:rotate-360

  - platform: template
    id: temperature_offset
    name: "Temperature Offset"
    unit_of_measurement: '°C'
    min_value: -100
    max_value: 100
    step: 0.1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 33
    icon: 'mdi:thermometer'
    entity_category: config

  - platform: template
    id: magnet_span
    name: "Magnet Span"
    entity_category: config
    mode: box
    min_value: 1.0
    max_value: 2000
    step: 0.1
    initial_value: 40.0
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-expand-vertical

  - platform: template
    id: threshold_lower
    name: "Threshold lower"
    entity_category: config
    mode: box
    min_value: -9999
    max_value: 9999
    step: 0.1
    initial_value: -9999
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-down

  - platform: template
    id: threshold_upper
    name: "Threshold upper"
    entity_category: config
    mode: box
    min_value: -9999
    max_value: 9999
    step: 0.1
    initial_value: 9999
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-up

  - platform: template
    id: calibration_minimal_axis_range
    name: "Calibration minimal axis range"
    entity_category: config
    icon: mdi:sine-wave
    mode: box
    min_value: 10
    max_value: 20
    step: 1
    initial_value: ${calibration_minimal_axis_range_initial_value}
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: µT

  - platform: template
    id: calibration_seconds
    name: "Calibration time"
    entity_category: config
    icon: mdi:timer
    mode: box
    min_value: 1
    max_value: 999
    step: 1
    initial_value: 5
    update_interval: never
    restore_value: true
    optimistic: true
    unit_of_measurement: s

select:
  - platform: template
    id: axis
    name: "Axis"
    entity_category: config
    icon: mdi:axis-arrow
    options:
      - x
      - y
      - z
      - None
    initial_option: None
    update_interval: never
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            id(selected_axis) = x;
            if (x == "None") {
              id(calibration_status).publish_state("Not Calibrated");
            } else if (!id(calibrating)) {
              id(calibration_status).publish_state("Ready");
            }

  - platform: template
    id: detection_algorithm
    name: "Detection algorithm"
    entity_category: config
    icon: mdi:auto-fix
    options:
      - Adaptive
      - Threshold
    initial_option: Adaptive
    update_interval: never
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: id(selected_algorithm) = x;

text_sensor:
  - platform: template
    id: calibration_status
    name: "Calibration Status"
    entity_category: diagnostic
    icon: mdi:information-outline
    update_interval: never

button:
  - platform: template
    id: calibrate_button
    name: "Calibrate axis"
    entity_category: config
    icon: mdi:tune
    on_press:
      - lambda: |-
          ESP_LOGI("calibration", "Starting calibration. Make sure ${device_class} is running");
          id(calibration_status).publish_state("Calibrating...");
          id(calibrating_axis_x_min) = std::numeric_limits<float>::max();
          id(calibrating_axis_x_max) = std::numeric_limits<float>::lowest();
          id(calibrating_axis_y_min) = std::numeric_limits<float>::max();
          id(calibrating_axis_y_max) = std::numeric_limits<float>::lowest();
          id(calibrating_axis_z_min) = std::numeric_limits<float>::max();
          id(calibrating_axis_z_max) = std::numeric_limits<float>::lowest();
          id(calibrating) = true;
      - delay: !lambda return id(calibration_seconds).state * 1000;
      - lambda: |-
          id(calibrating) = false;
          float x_range = id(calibrating_axis_x_max) - id(calibrating_axis_x_min);
          float y_range = id(calibrating_axis_y_max) - id(calibrating_axis_y_min);
          float z_range = id(calibrating_axis_z_max) - id(calibrating_axis_z_min);
          float min_axis_range = id(calibration_minimal_axis_range).state;
          // Log diagnostic info for each axis
          if (x_range < 0) {
            ESP_LOGW("calibration", "Didn't get any values for x");
          } else {
            ESP_LOGI("calibration", "x ranged from %.2f to %.2f (range: %.2f)",
                     id(calibrating_axis_x_min), id(calibrating_axis_x_max), x_range);
          }
          if (y_range < 0) {
            ESP_LOGW("calibration", "Didn't get any values for y");
          } else {
            ESP_LOGI("calibration", "y ranged from %.2f to %.2f (range: %.2f)",
                     id(calibrating_axis_y_min), id(calibrating_axis_y_max), y_range);
          }
          if (z_range < 0) {
            ESP_LOGW("calibration", "Didn't get any values for z");
          } else {
            ESP_LOGI("calibration", "z ranged from %.2f to %.2f (range: %.2f)",
                     id(calibrating_axis_z_min), id(calibrating_axis_z_max), z_range);
          }
          std::string axis_with_largest_range;
          float min, max;
          float max_range_found = 0;
          if (x_range > min_axis_range && x_range > y_range && x_range > z_range) {
            axis_with_largest_range = "x";
            min = id(calibrating_axis_x_min);
            max = id(calibrating_axis_x_max);
            max_range_found = x_range;
          } else if (y_range > min_axis_range && y_range > x_range && y_range > z_range) {
            axis_with_largest_range = "y";
            min = id(calibrating_axis_y_min);
            max = id(calibrating_axis_y_max);
            max_range_found = y_range;
          } else if (z_range > min_axis_range && z_range > x_range && z_range > y_range) {
            axis_with_largest_range = "z";
            min = id(calibrating_axis_z_min);
            max = id(calibrating_axis_z_max);
            max_range_found = z_range;
          } else {
            ESP_LOGE("calibration", "Calibration failed. No axis had a range of at least %.0f", min_axis_range);
            id(calibration_status).publish_state("Failed: low signal");
            return;
          }

          id(axis).make_call().set_option(axis_with_largest_range).perform();

          // Set magnet span for adaptive algorithm
          id(magnet_span).make_call().set_value(roundf(max_range_found * 10) / 10).perform();
          id(track_max) = NAN;
          id(track_min) = NAN;

          // Set thresholds for threshold-based algorithm
          float tolerance = 5 / (20.0 / min_axis_range);
          float lower_threshold = min + (max - min) / 2 - tolerance;
          float upper_threshold = min + (max - min) / 2 + tolerance;
          id(threshold_lower).make_call().set_value(roundf(lower_threshold * 10) / 10).perform();
          id(threshold_upper).make_call().set_value(roundf(upper_threshold * 10) / 10).perform();

          ESP_LOGI("calibration", "Calibration complete: axis=%s, span=%.2f, thresholds=[%.1f, %.1f]",
                   axis_with_largest_range.c_str(), max_range_found, lower_threshold, upper_threshold);

sensor:
  # Raw magnetometer values fed from the I2C polling interval below.
  # Their on_value feeds the detection algorithm and calibration capture.
  - platform: template
    id: magnetometer_x
    name: "Magnetic Field Strength X"
    internal: ${hide_magnetic_field_strength_sensors}
    entity_category: diagnostic
    unit_of_measurement: µT
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            if (id(selected_axis) == "x") id(axis_value).publish_state(x);

  - platform: template
    id: magnetometer_y
    name: "Magnetic Field Strength Y"
    internal: ${hide_magnetic_field_strength_sensors}
    entity_category: diagnostic
    unit_of_measurement: µT
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            if (id(selected_axis) == "y") id(axis_value).publish_state(x);

  - platform: template
    id: magnetometer_z
    name: "Magnetic Field Strength Z"
    internal: ${hide_magnetic_field_strength_sensors}
    entity_category: diagnostic
    unit_of_measurement: µT
    accuracy_decimals: 1
    on_value:
      then:
        - lambda: |-
            if (id(selected_axis) == "z") id(axis_value).publish_state(x);

  # Holds the magnetic field strength value of x, y, or z depending on the axis template select.
  # Increments counters when value crosses thresholds.
  - platform: template
    id: axis_value
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(selected_algorithm) == "Adaptive") {
              // === ADAPTIVE ALGORITHM: Min/Max Tracker with Range Clamping ===

              // 1. Initialize Trackers if empty (NAN on boot or after calibration)
              if (std::isnan(id(track_max)) || std::isnan(id(track_min))) {
                 id(track_max) = x + (id(magnet_span).state / 2.0);
                 id(track_min) = x - (id(magnet_span).state / 2.0);
              }

              // 2. Linear Decay (Very Slow) - pulls max down and min up to follow thermal drift
              float decay = ${tracker_decay_rate};
              id(track_max) -= decay;
              id(track_min) += decay;

              // 3. Expand Trackers based on current signal AND Clamp Span
              float max_allowed_span = id(magnet_span).state * ${max_span_multiplier};

              if (x > id(track_max)) {
                id(track_max) = x;
                // If expanding Max makes the window too huge, drag Min up
                if ((id(track_max) - id(track_min)) > max_allowed_span) {
                   id(track_min) = id(track_max) - max_allowed_span;
                }
              }
              if (x < id(track_min)) {
                id(track_min) = x;
                // If expanding Min makes the window too huge, drag Max down
                if ((id(track_max) - id(track_min)) > max_allowed_span) {
                   id(track_max) = id(track_min) + max_allowed_span;
                }
              }

              // 4. Enforce Minimum Span - prevents window from collapsing when flow stops
              float min_span = id(magnet_span).state * ${min_span_multiplier};
              float current_span = id(track_max) - id(track_min);

              if (current_span < min_span) {
                 float correction = (min_span - current_span) / 2.0;
                 id(track_max) += correction;
                 id(track_min) -= correction;
              }

              // 5. Calculate Center and Hysteresis (25% of window size)
              float midpoint = (id(track_max) + id(track_min)) / 2.0;
              float hyst = (id(track_max) - id(track_min)) * 0.25;

              // 6. Trigger Logic
              if (x > (midpoint + hyst) && !id(axis_value_high)) {
                id(axis_value_high) = true;
                id(half_rotations_total) += 1;
                id(half_rotations_flow) += 1;
                id(led).turn_on();
              } else if (x < (midpoint - hyst) && id(axis_value_high)) {
                id(axis_value_high) = false;
                id(led).turn_off();
              }
              return;
            }
            // === THRESHOLD ALGORITHM: Fixed thresholds ===
            if (x > id(threshold_upper).state && !id(axis_value_high)) {
              id(axis_value_high) = true;
              id(half_rotations_total) += 1;
              id(half_rotations_flow) += 1;
              id(led).turn_on();
            } else if (x < id(threshold_lower).state && id(axis_value_high)) {
              id(axis_value_high) = false;
              id(led).turn_off();
            }

  - platform: template
    id: temperature
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer"

  - platform: template
    id: ha_track_min
    name: "Water Meter Track Min"
    lambda: return id(track_min);
    update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 1
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-down
    filters:
      - delta: ${magnetic_field_update_delta}

  - platform: template
    id: ha_track_max
    name: "Water Meter Track Max"
    lambda: return id(track_max);
    update_interval: 1s
    entity_category: diagnostic
    accuracy_decimals: 1
    unit_of_measurement: µT
    icon: mdi:arrow-collapse-up
    filters:
      - delta: ${magnetic_field_update_delta}

  - platform: template
    id: ha_half_rotations
    name: "Water Meter Half Rotations"
    lambda: return id(half_rotations_total);
    update_interval: 1s
    accuracy_decimals: 0
    state_class: 'total_increasing'
    icon: 'mdi:counter'
    filters:
      - delta: 1

  - platform: template
    id: sensor_total
    name: "Total"
    lambda: return id(half_rotations_total) * id(volume_per_half_rotation).state;
    update_interval: 10s
    accuracy_decimals: 2
    device_class: ${device_class}
    icon: ${device_icon}
    state_class: total_increasing
    unit_of_measurement: ${volume_unit}
    filters:
      - or:
          - throttle: 60s
          - delta: 0

  - platform: template
    id: sensor_flow
    name: "Flow"
    device_class: volume_flow_rate
    icon: mdi:speedometer
    lambda: |-
      float flow = id(half_rotations_flow) * id(volume_per_half_rotation).state * 60.0 / ${flow_update_interval_seconds};
      id(half_rotations_flow) = 0;
      return flow;
    update_interval: ${flow_update_interval_seconds}s
    accuracy_decimals: 2
    state_class: measurement
    unit_of_measurement: ${volume_unit}/min
    filters:
      - or:
          - throttle: 60s
          - delta: 0

switch:
  # LED flashes faster/slower as magnet rotates on water meter
  - platform: gpio
    id: led
    pin:
      number: ${gpio_led}
      inverted: true

# Raw I2C Polling for the 0x2C Magnetometer Clone
interval:
  - interval: ${sensor_update_interval}
    then:
      - lambda: |-
          uint8_t reg = 0x00;
          uint8_t data[6] = {0};

          // Read 6 data registers (0x00 to 0x05)
          if (id(i2c_bus).write(0x2C, &reg, 1) == esphome::i2c::ERROR_OK &&
              id(i2c_bus).read(0x2C, data, 6) == esphome::i2c::ERROR_OK) {

            int16_t raw_x = (int16_t)((data[1] << 8) | data[0]);
            int16_t raw_y = (int16_t)((data[3] << 8) | data[2]);
            int16_t raw_z = (int16_t)((data[5] << 8) | data[4]);

            float x_uT = raw_x * 0.1f;
            float y_uT = raw_y * 0.1f;
            float z_uT = raw_z * 0.1f;

            // Freeze Watchdog: If X, Y, Z are identical for 50 cycles (~1s), re-arm register 0x09
            static float prev_x = 0, prev_y = 0, prev_z = 0;
            static uint8_t freeze_count = 0;

            if (x_uT == prev_x && y_uT == prev_y && z_uT == prev_z) {
              freeze_count++;
            } else {
              freeze_count = 0;
            }

            prev_x = x_uT;
            prev_y = y_uT;
            prev_z = z_uT;

            if (freeze_count >= 50) {
              freeze_count = 0;
              uint8_t rearm[2] = {0x09, 0x1D};
              id(i2c_bus).write(0x2C, rearm, 2);
              ESP_LOGW("magnetometer_clone", "Data static detected: Re-armed mode reg 0x09");
            }

            // Publish raw states (feeds the detection algorithm via on_value)
            id(magnetometer_x).publish_state(x_uT);
            id(magnetometer_y).publish_state(y_uT);
            id(magnetometer_z).publish_state(z_uT);

            // Capture per-axis min/max while calibrating
            if (id(calibrating)) {
              id(calibrating_axis_x_min) = std::min(id(calibrating_axis_x_min), x_uT);
              id(calibrating_axis_x_max) = std::max(id(calibrating_axis_x_max), x_uT);
              id(calibrating_axis_y_min) = std::min(id(calibrating_axis_y_min), y_uT);
              id(calibrating_axis_y_max) = std::max(id(calibrating_axis_y_max), y_uT);
              id(calibrating_axis_z_min) = std::min(id(calibrating_axis_z_min), z_uT);
              id(calibrating_axis_z_max) = std::max(id(calibrating_axis_z_max), z_uT);
            }

            // Throttled logging (every 2s / 100 cycles)
            static uint8_t log_counter = 0;
            if (++log_counter >= 100) {
              log_counter = 0;
              ESP_LOGD("magnetometer_clone", "µT -> X: %.1f, Y: %.1f, Z: %.1f", x_uT, y_uT, z_uT);
            }

            // Temperature read (separate read so a failure can't kill the magnetic data)
            uint8_t treg = 0x07;
            uint8_t tdata[2] = {0};
            if (id(i2c_bus).write(0x2C, &treg, 1) == esphome::i2c::ERROR_OK &&
                id(i2c_bus).read(0x2C, tdata, 2) == esphome::i2c::ERROR_OK) {
              int16_t raw_temp = (int16_t)((tdata[1] << 8) | tdata[0]);
              float temp_c = raw_temp / 100.0f + id(temperature_offset).state;
              // Throttled publish to HA (every 10s / 500 cycles)
              static uint8_t temp_pub_counter = 0;
              if (++temp_pub_counter >= 500) {
                temp_pub_counter = 0;
                id(temperature).publish_state(temp_c);
              }
            }
          }
