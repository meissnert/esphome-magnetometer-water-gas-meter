# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml

substitutions:
  gpio_led: GPIO2
  volume_unit: 'gal'
  i2c_scl: GPIO14  # Pin D5
  i2c_sda: GPIO12  # Pin D6
  device_class: 'water'
  device_icon: 'mdi:water'

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 50kHz
  scan: true

# Remote Package Import
packages:
  meter:
    url: https://github.com/meissnert/esphome-magnetometer-water-gas-meter
    ref: main
    files: [esphome-water-meter.yaml]
    refresh: 0s

# Raw I2C Polling for 0x2C Magnetometer Clone
# Raw I2C Polling with Debug Logging
interval:
  - interval: 100ms
    then:
      - lambda: |-
          uint8_t reg = 0x00;
          uint8_t data[6] = {0};

          // Read 6 data registers (0x00 to 0x05)
          if (id(i2c_bus).write(0x2C, &reg, 1) == esphome::i2c::ERROR_OK &&
              id(i2c_bus).read(0x2C, data, 6) == esphome::i2c::ERROR_OK) {

            int16_t raw_x = (int16_t)((data[1] << 8) | data[0]);
            int16_t raw_y = (int16_t)((data[3] << 8) | data[2]);
            int16_t raw_z = (int16_t)((data[5] << 8) | data[4]);

            float x_uT = raw_x * 0.1f;
            float y_uT = raw_y * 0.1f;
            float z_uT = raw_z * 0.1f;

            // Freeze Watchdog: If X, Y, Z are identical for 10 cycles (~1s), re-arm register 0x09
            static float prev_x = 0, prev_y = 0, prev_z = 0;
            static uint8_t freeze_count = 0;

            if (x_uT == prev_x && y_uT == prev_y && z_uT == prev_z) {
              freeze_count++;
            } else {
              freeze_count = 0;
            }

            prev_x = x_uT;
            prev_y = y_uT;
            prev_z = z_uT;

            if (freeze_count >= 10) {
              freeze_count = 0;
              uint8_t rearm[2] = {0x09, 0x1D};
              id(i2c_bus).write(0x2C, rearm, 2);
              ESP_LOGW("magnetometer_clone", "Data static detected: Re-armed mode reg 0x09");
            }

            // Publish raw states
            id(magnetometer_x).publish_state(x_uT);
            id(magnetometer_y).publish_state(y_uT);
            id(magnetometer_z).publish_state(z_uT);

            // Forward package tracking globals to template sensors
            // Throttled tracking publish to HA (every ~1s / 10 cycles)
            static uint8_t track_pub_counter = 0;
            if (++track_pub_counter >= 10) {
              track_pub_counter = 0;
              id(ha_track_min).publish_state(id(track_min));
              id(ha_track_max).publish_state(id(track_max));
              id(ha_half_rotations).publish_state(id(half_rotations_total));
            }

            // Throttled logging (every 2s)
            static uint8_t log_counter = 0;
            if (++log_counter >= 20) {
              log_counter = 0;
              ESP_LOGD("magnetometer_clone", "µT -> X: %.1f, Y: %.1f, Z: %.1f", x_uT, y_uT, z_uT);
            }

            // Temperature fallback publish (every 10s)
            static uint8_t temp_pub_counter = 0;
            if (++temp_pub_counter >= 100) {
              temp_pub_counter = 0;
              float temp_offset = id(temperature_offset).state;
              id(temperature).publish_state(temp_offset);
            }
          }

sensor:
  - platform: template
    id: temperature
    name: "Temperature"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    icon: "mdi:thermometer"
    
  - platform: template
    name: "Water Meter Track Min"
    id: ha_track_min
    unit_of_measurement: "µT"
    icon: "mdi:arrow-collapse-down"
    accuracy_decimals: 1

  - platform: template
    name: "Water Meter Track Max"
    id: ha_track_max
    unit_of_measurement: "µT"
    icon: "mdi:arrow-collapse-up"
    accuracy_decimals: 1

  - platform: template
    name: "Water Meter Half Rotations"
    id: ha_half_rotations
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: total_increasing
    
esphome:
  name: water-meter
  friendly_name: Water meter
  on_boot:
    priority: 800.0
    then:
      - lambda: |-
          // Write continuous mode to reg 0x09 (0x1D) and SET/RESET to reg 0x0A (0x01)
          uint8_t init_mode[2] = {0x09, 0x1D};
          uint8_t init_sr[2]   = {0x0A, 0x01};
          id(i2c_bus).write(0x2C, init_mode, 2);
          id(i2c_bus).write(0x2C, init_sr, 2);
          ESP_LOGI("magnetometer_clone", "Sensor initialized on boot.");

